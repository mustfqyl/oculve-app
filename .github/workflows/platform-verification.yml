name: Platform verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux, Android, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config iproute2 nftables libgtk-3-dev libstdc++-12-dev libsecret-1-dev libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.9'

      - name: Fetch Dart dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Test Linux tunnel policy
        run: python3 -m unittest discover -s test -p '*_test.py'

      - name: Probe isolated tunnel test capabilities
        id: linux-net-probe
        run: python3 tool/probe_linux_network_ci.py

      - name: Fetch and verify Linux Xray runtime
        run: python3 tool/prepare_desktop.py linux

      - name: Run Flutter tests and real Xray integration tests
        id: flutter-tests
        run: |
          set +e
          flutter test --reporter expanded > "$RUNNER_TEMP/flutter-tests.log" 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            python3 tool/ci_failure_annotation.py "$RUNNER_TEMP/flutter-tests.log" "Linux Flutter tests"
          fi
          exit "$result"
        env:
          XRAY_TEST_BINARY: linux/xray/xray

      - name: Build Linux desktop app
        id: linux-build
        run: |
          set +e
          flutter build linux --release > "$RUNNER_TEMP/linux-build.log" 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            python3 tool/ci_failure_annotation.py "$RUNNER_TEMP/linux-build.log" "Linux desktop build"
          fi
          exit "$result"

      - name: Package portable Linux test build
        id: linux-package
        if: steps.linux-build.outcome == 'success'
        run: sh tool/package_linux.sh

      - name: Build Android debug APK
        id: android-build
        run: |
          set +e
          flutter build apk --debug > "$RUNNER_TEMP/android-build.log" 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            python3 tool/ci_failure_annotation.py "$RUNNER_TEMP/android-build.log" "Android debug build"
          fi
          exit "$result"

      - name: Write sanitized Linux job report
        if: always()
        shell: bash
        run: |
          {
            echo "Platform: Linux x64"
            echo "Flutter tests (XRAY_TEST_BINARY pinned by tool/prepare_desktop.py): ${{ steps.flutter-tests.outcome }}"
            echo "Linux release build: ${{ steps.linux-build.outcome }}"
            echo "Portable package with Linux tunnel helper and runtimes: ${{ steps.linux-package.outcome }}"
            echo "Android debug APK build: ${{ steps.android-build.outcome }}"
            echo "Linux kernel leak test capability probe: ${{ steps.linux-net-probe.outputs.available }}"
            echo "Linux desktop window launch smoke test: not run on the hosted runner"
            echo "Live Linux TUN traffic/leak test: not run; capability probe only"
          } > "$RUNNER_TEMP/oculve-linux-report.txt"
          cat "$RUNNER_TEMP/oculve-linux-report.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Store Linux build and sanitized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oculve-linux-build-and-report
          path: |
            dist/Oculve-Linux-Test.tar.gz
            ${{ runner.temp }}/oculve-linux-report.txt
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Windows desktop and tests
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Add Windows SDK manifest tool to PATH
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $mt = Get-ChildItem $sdkBin -Filter mt.exe -File -Recurse |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $mt) { throw "Windows SDK x64 mt.exe was not found under $sdkBin" }
          Add-Content $env:GITHUB_PATH $mt.DirectoryName
          Write-Output "Using Windows SDK manifest tool: $($mt.FullName)"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.9'

      - name: Fetch Dart dependencies
        run: flutter pub get

      - name: Fetch and verify Windows VPN runtimes
        run: python tool/prepare_desktop.py windows

      - name: Run Flutter tests and real Xray integration tests
        id: flutter-tests
        run: |
          $log = Join-Path $env:RUNNER_TEMP "flutter-tests.log"
          flutter test --reporter expanded *> $log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            python tool/ci_failure_annotation.py $log "Windows Flutter tests"
          }
          exit $result
        env:
          XRAY_TEST_BINARY: windows/xray/xray.exe

      - name: Run Windows native regression tests
        id: native-tests
        shell: pwsh
        run: |
          cmake -S tool/windows_native_tests -B "$env:RUNNER_TEMP/oculve-windows-native-tests" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/oculve-windows-native-tests" --config Debug --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/oculve-windows-native-tests" -C Debug --output-on-failure
          exit $LASTEXITCODE

      - name: Build Windows desktop app
        id: windows-build
        run: |
          $log = Join-Path $env:RUNNER_TEMP "windows-build.log"
          flutter build windows --release --verbose *> $log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $mt = Get-Command mt.exe -ErrorAction SilentlyContinue
            if ($mt) {
              Add-Content $log "mt.exe path: $($mt.Source)"
              $merged = Join-Path $env:RUNNER_TEMP "oculve-merged.manifest"
              & $mt.Source -nologo -manifest "windows\runner\runner.exe.manifest" "-out:$merged" *>> $log
              Add-Content $log "Standalone manifest merge exit code: $LASTEXITCODE"
              $exe = Get-ChildItem "build\windows\x64\runner" -Filter "oculve.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($exe) {
                & $mt.Source -nologo -manifest "windows\runner\runner.exe.manifest" "-outputresource:$($exe.FullName);#1" *>> $log
                Add-Content $log "Manual executable manifest embed exit code: $LASTEXITCODE"
              } else {
                Add-Content $log "No linked executable was available for manual manifest embedding."
              }
            } else {
              Add-Content $log "mt.exe was not found on PATH."
            }
            python tool/ci_failure_annotation.py $log "Windows desktop build"
          }
          exit $result

      - name: Package portable Windows test build
        id: windows-package
        if: steps.windows-build.outcome == 'success'
        shell: pwsh
        run: ./tool/package_windows.ps1

      - name: Write sanitized Windows job report
        if: always()
        shell: pwsh
        run: |
          @(
            'Platform: Windows x64'
            'Flutter tests (XRAY_TEST_BINARY pinned by tool/prepare_desktop.py): ${{ steps.flutter-tests.outcome }}'
            'Native regression tests (WFP recording backend): ${{ steps.native-tests.outcome }}'
            'Windows release build: ${{ steps.windows-build.outcome }}'
            'Portable package with app-local Microsoft runtimes: ${{ steps.windows-package.outcome }}'
            'Windows desktop window launch smoke test: not run on the hosted runner'
            'Live WFP tunnel/leak test: not run on GitHub-hosted runner'
          ) | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'oculve-windows-report.txt')
          Get-Content (Join-Path $env:RUNNER_TEMP 'oculve-windows-report.txt') | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Store Windows build and sanitized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oculve-windows-build-and-report
          path: |
            dist/Oculve-Windows-Test.zip
            ${{ runner.temp }}/oculve-windows-report.txt
          if-no-files-found: warn
          retention-days: 7
