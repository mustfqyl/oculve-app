name: Platform verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux, Android, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.9'

      - name: Fetch Dart dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Test Linux tunnel policy
        run: python3 -m unittest discover -s test -p '*_test.py'

      - name: Fetch and verify Linux Xray runtime
        run: python3 tool/prepare_desktop.py linux

      - name: Run Flutter tests and real Xray integration tests
        run: flutter test --reporter compact
        env:
          XRAY_TEST_BINARY: linux/xray/xray

      - name: Build Linux desktop app
        run: flutter build linux --debug

      - name: Build Android debug APK
        run: flutter build apk --debug

  windows:
    name: Windows desktop and tests
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.9'

      - name: Fetch Dart dependencies
        run: flutter pub get

      - name: Fetch and verify Windows VPN runtimes
        run: python tool/prepare_desktop.py windows

      - name: Run Flutter tests and real Xray integration tests
        run: flutter test --reporter compact
        env:
          XRAY_TEST_BINARY: windows/xray/xray.exe

      - name: Build Windows desktop app
        run: flutter build windows --debug
